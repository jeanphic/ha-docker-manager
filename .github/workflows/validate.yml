name: Validate & Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate with HACS & hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

      - name: hassfest validation
        uses: home-assistant/actions/hassfest@master

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create release ZIP
        run: |
          mkdir -p dist
          cd custom_components
          zip -r ../dist/ha-docker-manager-${{ steps.version.outputs.VERSION }}.zip docker_manager/
          cd ..
          # Also create the standard ha-docker-manager.zip for HACS
          cp dist/ha-docker-manager-${{ steps.version.outputs.VERSION }}.zip dist/ha-docker-manager.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ha-docker-manager-${{ steps.version.outputs.VERSION }}.zip
            dist/ha-docker-manager.zip
          generate_release_notes: true
          body: |
            ## Docker Manager v${{ steps.version.outputs.VERSION }}

            ### Installation via HACS
            Add this repository to HACS as a custom integration, or wait for it to appear in the default HACS store.

            ### Manual installation
            Download `ha-docker-manager.zip`, extract and copy `docker_manager/` to `config/custom_components/`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
