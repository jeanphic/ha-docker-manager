prune_images:
  name: Prune Images
  description: Remove unused Docker images to free up disk space.
  fields:
    all_unused:
      name: All unused
      description: >
        If true, removes ALL images not used by any container.
        If false (default), removes only dangling (untagged) images.
      required: false
      default: false
      selector:
        boolean:
